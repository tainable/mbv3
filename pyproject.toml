[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matched-betting"
version = "0.1.0"
description = "Initial odds ingestion layer for a matched betting system."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Guy Semple" }
]
dependencies = [
  "requests>=2.28",
]

[project.scripts]
matched-betting = "matched_betting.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
